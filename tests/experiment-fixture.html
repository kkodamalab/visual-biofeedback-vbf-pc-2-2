<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../src/styles.css"><link rel="stylesheet" href="../src/remote-display.css"><link rel="stylesheet" href="../src/gauge.css"><link rel="stylesheet" href="../src/experiment.css"></head><body>
<div class="workspace">
<article class="camera-panel" data-view="front"><div class="viewport"><video></video><canvas></canvas></div><div class="metrics"><strong data-metric="knee"></strong><i data-bar="knee"></i><strong data-metric="hip"></strong><i data-bar="hip"></i><strong data-metric="trunk"></strong><i data-bar="trunk"></i></div></article>
<article class="camera-panel" data-view="side"><div class="viewport"><video></video><canvas></canvas></div><div class="metrics"><strong data-metric="knee"></strong><i data-bar="knee"></i><strong data-metric="hip"></strong><i data-bar="hip"></i><strong data-metric="trunk"></strong><i data-bar="trunk"></i></div></article>
</div><div class="remote-record"></div><p id="result">RUNNING</p>
<script type="module">
import { createExperiment } from "../src/experiment.js";
try {
  let beepCount = 0;
  const views = Object.fromEntries(["front", "side"].map(name => {
    const root = document.querySelector(`[data-view=${name}]`);
    return [name, { root, video: root.querySelector("video"), canvas: root.querySelector("canvas"), source: name === "front" ? "A" : "B" }];
  }));
  const experiment = createExperiment({ views, sourceState: () => ({ stream: null, landmarks: null }), onSettingsChange: () => {}, beep: () => { beepCount++; return true; }, unlockAudio: async () => {} });
  const points = Array.from({ length: 33 }, (_, index) => ({ x: .3 + index / 100, y: .2 + index / 120, z: 0, visibility: 1 }));
  experiment.sample("A", points); experiment.sample("B", points); experiment.refreshSettings();
  document.querySelector('[data-visual="gauge"]').click();
  const frontGauges = views.front.root.querySelector('.experiment-gauges');
  if (frontGauges.hidden || frontGauges.querySelectorAll('.gauge-card').length !== 3 || views.side.root.querySelector('.experiment-gauges').hidden) throw new Error("Selected angle gauges did not appear on both views");
  if (!frontGauges.querySelector('[data-key="left.knee"] .gauge-status').textContent.includes('高い')) throw new Error("Knee gauge did not compare with target");
  const kneeTarget = document.querySelector('[data-target-value="knee"]'); kneeTarget.value = "180"; kneeTarget.dispatchEvent(new Event("change", { bubbles: true }));
  if (!frontGauges.querySelector('[data-key="left.knee"]').classList.contains('inside')) throw new Error("Knee gauge target zone did not update immediately");
  document.querySelector('[data-angle-side="right"]').click();
  if (experiment.settings.angleSides.length !== 2 || !frontGauges.querySelector('[data-key="right.knee"]') || frontGauges.querySelectorAll('.gauge-card').length !== 5) throw new Error("Left/Right angles were not displayed together");
  const sampleForCsv = { t: 0, ...await import('../src/experiment-math.js').then(module => module.evaluate(points)), landmarks: points };
  const csv = experiment.csvRows({ id: 1, timestamp: 'test', sources: { front: 'A', side: 'B' }, samples: { front: [sampleForCsv], side: [] }, settings: experiment.settings });
  if (!('left_knee' in csv[0]) || !('right_knee' in csv[0]) || !csv[0].angle_sides.includes('right')) throw new Error("CSV did not retain both angle sides");
  const direction = document.querySelector('#gaugeDirection'); direction.value = 'vertical'; direction.dispatchEvent(new Event('change', { bubbles: true }));
  if (frontGauges.dataset.direction !== 'vertical') throw new Error("Gauge orientation did not switch");
  direction.value = 'horizontal'; direction.dispatchEvent(new Event('change', { bubbles: true }));
  document.querySelector('[data-visual="gauge"]').click();
  if (!frontGauges.hidden) throw new Error("Gauge OFF did not remove the region");
  const checksum = canvas => canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data.reduce((sum, value) => sum + value, 0);
  const beforeToggle = checksum(views.front.canvas);
  const beforeSide = checksum(views.side.canvas);
  if (document.querySelectorAll('.camera-panel > .experiment-wave').length !== 2) throw new Error("Waveforms not directly below each camera");
  document.querySelector('[data-visual="waveform"]').click();
  if (document.querySelector('.camera-panel .experiment-wave').hidden) throw new Error("Waveform ON did not show camera waveform");
  document.querySelector('[data-visual="waveform"]').click();
  if (!document.querySelector('.camera-panel .experiment-wave').hidden) throw new Error("Waveform OFF left a graph region");
  const line = document.querySelector('[data-level="skeletonWidth"]'); line.value = "5"; line.dispatchEvent(new Event("input", { bubbles: true }));
  if (experiment.settings.skeletonWidth !== 5 || checksum(views.front.canvas) === beforeToggle || checksum(views.side.canvas) === beforeSide) throw new Error("Skeleton line width was not applied to both views");
  const beforeMarker = checksum(views.front.canvas);
  const marker = document.querySelector('[data-level="markerSize"]'); marker.value = "1"; marker.dispatchEvent(new Event("input", { bubbles: true }));
  if (experiment.settings.markerSize !== 1 || document.querySelector('[data-level-output="markerSize"]').value !== "1" || checksum(views.front.canvas) === beforeMarker) throw new Error("Marker size was not applied");
  document.querySelector('[data-angle="knee"]').click();
  if (checksum(views.front.canvas) === beforeToggle) throw new Error("Angle checkbox did not update overlay immediately");
  document.querySelector('[data-angle="knee"]').click();
  document.querySelector('[data-group="camera"] [data-value="off"]').click();
  if (getComputedStyle(views.front.video).visibility !== "hidden" || checksum(views.front.canvas) === 0) throw new Error("Camera video OFF hid the skeleton or kept video visible");
  const skeletonOn = checksum(views.front.canvas);
  document.querySelector('[data-visual="skeleton"]').click();
  if (checksum(views.front.canvas) === skeletonOn || checksum(views.front.canvas) === 0) throw new Error("Video OFF forced skeleton or hid selected variable");
  document.querySelector('[data-group="camera"] [data-value="on"]').click();
  if (getComputedStyle(views.front.video).visibility === "hidden") throw new Error("Camera video ON did not restore video");
  if (checksum(views.front.canvas) === skeletonOn) throw new Error("Video ON forced skeleton back on");
  document.querySelector('[data-visual="skeleton"]').click();
  document.querySelector('[data-position="hip"]').click();
  document.querySelector('[data-position="shoulder"]').click();
  document.querySelector('[data-position="knee"]').click();
  if (document.querySelector('[data-visual="trajectory"]').disabled) throw new Error("Trajectory remained disabled");
  document.querySelector('[data-visual="skeleton"]').click();
  const dotsOnly = checksum(views.front.canvas);
  document.querySelector('#connectPositions').click();
  if (!experiment.settings.connectPositions || checksum(views.front.canvas) === dotsOnly) throw new Error("Position connections did not draw independently of skeleton");
  document.querySelector('[data-visual="skeleton"]').click();
  document.querySelector('#connectPositions').click();
  document.querySelector('[data-visual="gauge"]').click();
  if (document.querySelector('[data-position-target="hip"]').hidden || !frontGauges.querySelector('[data-key="hip.x"]')) throw new Error("Selected position gauges were not added");
  document.querySelector('[data-visual="gauge"]').click();
  document.querySelector('#waveLowPass').click();
  if (!experiment.settings.waveLowPass) throw new Error("Low-pass checkbox did not update settings");
  document.querySelector('#waveLowPass').click();
  document.querySelector('#testBeep').click();
  await Promise.resolve();
  if (beepCount !== 1) throw new Error("Test Beep did not play");
  document.querySelector('[data-target-beep="knee"]').click();
  await Promise.resolve();
  experiment.sample("B", points); experiment.sample("B", points);
  if (beepCount !== 2) throw new Error("Target entry did not beep once");
  experiment.sample("B", points); experiment.sample("B", points);
  if (beepCount !== 2) throw new Error("Target zone continuously beeped");
  document.querySelector('[data-target-beep="knee"]').click();
  document.querySelector('[data-group="timing"] [data-value="terminal"]').click();
  for (let i = 0; i < 3; i++) {
    experiment.beginTrial(); experiment.sample("A", points); experiment.sample("B", points); await new Promise(resolve => setTimeout(resolve, 10)); experiment.endTrial({});
  }
  const buttons = document.querySelectorAll("#trialHistory .trial-item > button:first-child");
  if (buttons.length !== 3 || document.querySelector("#exportAllTrials").disabled) throw new Error("Trial history did not retain 3 trials");
  buttons[0].click();
  if (document.querySelector("#experimentReplay").hidden || !document.querySelector("#replayTitle").textContent.includes("01")) throw new Error("Older trial did not open");
  document.querySelector('[data-replay-option="video"]').click();
  if (!document.querySelector(".replay-viewport").classList.contains("skeleton-only")) throw new Error("Skeleton-only replay did not switch");
  document.querySelector("#replaySeek").value = "500";
  document.querySelector("#replaySeek").dispatchEvent(new Event("input"));
  if (!document.querySelector('[data-replay-wave="front"]').width || document.querySelector("#replaySeek").value !== "500") throw new Error("Waveform / seek did not render");
  document.querySelector("#closeExperimentReplay").click();
  document.querySelector('[data-group="timing"] [data-value="none"]').click();
  if (!views.front.root.classList.contains("feedback-suppressed")) throw new Error("No BF did not hide live feedback");
  experiment.beginTrial(); experiment.sample("A", points); experiment.sample("B", points); experiment.endTrial({});
  if (document.querySelectorAll("#trialHistory .trial-item").length !== 4 || !document.querySelector("#trialSummary").textContent.includes("No BF")) throw new Error("No BF did not retain an unreported trial");
  for (let i = 0; i < 8; i++) { experiment.beginTrial(); experiment.sample("A", points); experiment.endTrial({}); }
  if (document.querySelectorAll("#trialHistory .trial-item").length !== 10 || document.querySelector("#trialHistory").textContent.includes("Trial 01")) throw new Error("10-Trial retention failed");
  document.querySelector('[data-group="timing"] [data-value="concurrent"]').click();
  if (views.front.root.classList.contains("feedback-suppressed")) throw new Error("Concurrent did not restore live feedback");
  document.querySelector('[data-visual="gauge"]').click();
  document.querySelector('[data-visual="waveform"]').click();
  experiment.sample("A", points); experiment.sample("B", points); experiment.refreshSettings();
  if (frontGauges.hidden || frontGauges.querySelector('[data-key="left.knee"]').classList.contains('no-value') || views.front.root.querySelector('.experiment-wave').hidden) throw new Error("Gauge and waveform did not coexist during live feedback");
  document.querySelector("#result").textContent = "PASS: bilateral angles/CSV, position connections, filter switch, beep, gauges, waveform, older replay, No BF, 10-Trial cap";
} catch (error) { document.querySelector("#result").textContent = `FAIL: ${error.stack || error}`; }
</script></body></html>
