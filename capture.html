<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0f"><title>VBF / iPhone Side Camera</title><link rel="stylesheet" href="./src/styles.css"></head><body class="capture-body"><header class="topbar"><a class="brand" href="./"><span class="brand-mark">V</span><span><strong>VBF</strong><small>SIDE CAPTURE</small></span></a><div class="status"><span id="statusDot" class="dot"></span><span id="systemStatus">接続先を確認中</span></div></header><main class="capture-main"><section class="capture-heading"><p class="eyebrow">iPHONE / SIDE VIEW</p><h1>側面カメラ</h1><p>背面カメラを使用し、全身が画面内に収まる位置へ固定してください。</p></section><section class="capture-card camera-panel"><div class="viewport"><video playsinline muted></video><canvas></canvas><div class="placeholder"><span class="focus-frame"></span><strong>カメラ未接続</strong><small>下のボタンから開始してください</small></div><div class="cue">横向きでの使用を推奨</div></div><div class="capture-metrics metrics"><div class="metric"><span>膝</span><strong data-metric="knee">—<small>°</small></strong></div><div class="metric"><span>股関節</span><strong data-metric="hip">—<small>°</small></strong></div><div class="metric"><span>体幹</span><strong data-metric="trunk">—<small>°</small></strong></div></div></section><label class="camera-choice"><span>使用するカメラ</span><select id="cameraSelect"><option value="">背面カメラを自動選択</option></select></label><button id="startCapture" class="primary capture-start">側面カメラを開始 →</button><p class="privacy-note">映像は接続中のPCへ直接送られます。録画・保存は行いません。</p></main><script type="module" src="./src/capture.js"></script></body></html>
