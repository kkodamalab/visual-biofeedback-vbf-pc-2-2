<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0f"><title>VBF / Remote Camera</title><link rel="stylesheet" href="./src/styles.css"><link rel="stylesheet" href="./src/lecture.css"></head><body class="capture-body"><header class="topbar"><a class="brand" href="./"><span class="brand-mark">V</span><span><strong>VBF</strong><small>REMOTE CAPTURE</small></span></a><div class="status"><span id="statusDot" class="dot"></span><span id="systemStatus">接続先を確認中</span></div></header><main class="capture-main"><section class="capture-heading"><p class="eyebrow">SMARTPHONE / REMOTE VIEW</p><h1>Remote Camera</h1><p>全身が画面内に収まる位置へ固定してください。各端末でカメラを個別に選択できます。</p></section><section class="capture-card camera-panel"><div class="viewport"><video playsinline muted></video><canvas></canvas><div class="placeholder"><span class="focus-frame"></span><strong>カメラ未接続</strong><small>下のボタンから開始してください</small></div><div class="cue">全身表示（切り取りなし）</div></div><div class="capture-metrics metrics"><div class="metric"><span>膝</span><strong data-metric="knee">—<small>°</small></strong></div><div class="metric"><span>股関節</span><strong data-metric="hip">—<small>°</small></strong></div><div class="metric"><span>体幹</span><strong data-metric="trunk">—<small>°</small></strong></div></div></section><div class="lens-controls"><span>背面レンズ</span><div class="lens-switcher" role="group" aria-label="背面レンズ"><button type="button" data-lens="ultra" disabled>0.5×</button><button type="button" data-lens="wide" class="active">1×</button></div><small id="lensStatus" role="status">カメラを確認中…</small></div><label class="camera-choice"><span>使用するカメラ（手動選択も可能）</span><select id="cameraSelect"><option value="">背面カメラを自動選択</option></select></label><label class="fit-choice"><input id="fullBody" type="checkbox" checked> 全身表示（映像を切り取らない）</label><button id="startCapture" class="primary capture-start">カメラを開始 →</button><p class="privacy-note">映像は接続中のPCへ直接送られます。録画・保存は行いません。</p></main><script type="module" src="./src/capture.js"></script></body></html>
