<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VBF / Monitor View</title><link rel="stylesheet" href="./src/monitor.css"></head>
<body><header class="monitor-bar"><strong>VBF / MONITOR</strong><span id="monitorStatus">Dashboardに接続中…</span><nav aria-label="表示モード"><button type="button" data-mode="dual" class="active">Dual View</button><button type="button" data-mode="front">Front Only</button><button type="button" data-mode="side">Side Only</button></nav><button id="fullscreen" type="button">Fullscreen ⛶</button></header>
<main id="monitorGrid" class="monitor-grid" data-mode="dual"><section class="monitor-view" data-view="front"><h2>FRONT VIEW</h2><div class="monitor-frame"><canvas class="monitor-picture"></canvas><div class="monitor-target"></div></div><div class="monitor-values"></div><div class="monitor-wave" hidden><canvas></canvas></div></section><section class="monitor-view" data-view="side"><h2>SIDE VIEW</h2><div class="monitor-frame"><canvas class="monitor-picture"></canvas><div class="monitor-target"></div></div><div class="monitor-values"></div><div class="monitor-wave" hidden><canvas></canvas></div></section></main>
<p id="monitorCoach" class="monitor-coach"></p><script type="module" src="./src/monitor.js"></script></body></html>
